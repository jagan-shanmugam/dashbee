services:
  - type: web
    name: dashbee
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Database connection (auto-populated from database service)
      - key: DATABASE_URL
        fromDatabase:
          name: dashbee-db
          property: connectionString

      # AI Provider Configuration (user must provide)
      - key: OPENAI_API_KEY
        sync: false

      # Optional: Azure OpenAI
      - key: OPENAI_BASE_URL
        value: ""

      # Optional: OpenRouter
      - key: OPENROUTER_API_KEY
        value: ""

      # Optional: Gemini
      - key: GEMINI_API_KEY
        value: ""

      # Security (auto-generated)
      - key: NEXTAUTH_SECRET
        generateValue: true

      # Database Configuration
      - key: DATABASE_SSL
        value: "true"
      - key: ALLOWED_SCHEMAS
        value: "public"
      - key: MAX_QUERY_ROWS
        value: "1000"
      - key: QUERY_TIMEOUT_MS
        value: "5000"

      # Optional: Langfuse Observability
      - key: LANGFUSE_SECRET_KEY
        value: ""
      - key: LANGFUSE_PUBLIC_KEY
        value: ""
      - key: LANGFUSE_BASE_URL
        value: "https://cloud.langfuse.com"

      # Optional: AWS S3
      - key: AWS_ACCESS_KEY_ID
        value: ""
      - key: AWS_SECRET_ACCESS_KEY
        value: ""
      - key: AWS_REGION
        value: "us-east-1"

      # Optional: Google Cloud Storage
      - key: GCS_PROJECT_ID
        value: ""
      - key: GCS_KEY_FILE
        value: ""

databases:
  - name: dashbee-db
    plan: starter
    databaseName: dashbee
    user: dashbee
    postgresMajorVersion: "16"
